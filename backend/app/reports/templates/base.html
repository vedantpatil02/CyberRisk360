<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>{{ report.title }}</title>
<style>
    @page {
        size: A4;
        margin: 2cm 1.6cm;
    }
    body {
        font-family: Helvetica, Arial, sans-serif;
        color: #1f2933;
        font-size: 10pt;
        line-height: 1.4;
    }
    h1 {
        font-size: 20pt;
        color: #0b3d59;
        margin: 0 0 4px 0;
    }
    h2 {
        font-size: 13pt;
        color: #0b3d59;
        border-bottom: 2px solid #0b3d59;
        padding-bottom: 3px;
        margin: 22px 0 10px 0;
    }
    .meta {
        color: #52606d;
        font-size: 9pt;
        margin-bottom: 4px;
    }
    .brand {
        color: #2477b3;
        font-weight: bold;
        letter-spacing: 1px;
        font-size: 9pt;
    }
    hr {
        border: none;
        border-top: 1px solid #cbd2d9;
        margin: 10px 0 0 0;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin: 6px 0 12px 0;
    }
    th {
        background-color: #0b3d59;
        color: #ffffff;
        text-align: left;
        padding: 5px 7px;
        font-size: 9pt;
    }
    td {
        border-bottom: 1px solid #e4e7eb;
        padding: 5px 7px;
        vertical-align: top;
        font-size: 9pt;
    }
    tr:nth-child(even) td {
        background-color: #f5f7fa;
    }
    .kpi {
        font-size: 15pt;
        font-weight: bold;
        color: #0b3d59;
    }
    .sev-critical { color: #b71c1c; font-weight: bold; }
    .sev-high     { color: #e65100; font-weight: bold; }
    .sev-medium   { color: #b58900; font-weight: bold; }
    .sev-low      { color: #2e7d32; font-weight: bold; }
    .muted { color: #7b8794; }
    .finding-desc { color: #52606d; font-size: 8.5pt; }
</style>
</head>
<body>
    <div class="brand">CYBERRISK360</div>
    <h1>{{ report.title }}</h1>
    <div class="meta">{{ report.report_type }}</div>
    <div class="meta">
        Generated: {{ report.generated_at }}
        &nbsp;|&nbsp; By: {{ report.generated_by }}
    </div>
    <hr />

    {% block content %}{% endblock %}
</body>
</html>
